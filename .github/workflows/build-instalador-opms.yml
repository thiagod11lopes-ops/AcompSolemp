name: Build Instalador OPMS (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/desktop-url-shell-bcc8
      - main
    paths:
      - 'Instalador OPMS/**'
      - '.github/workflows/build-instalador-opms.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar Instalar-AcompOPMS (portable)
        shell: pwsh
        run: |
          Set-Location 'Instalador OPMS'
          & '.\scripts\build-tudo.ps1'

      - name: Listar saida
        shell: pwsh
        run: Get-ChildItem 'Instalador OPMS\Para-distribuir\*.exe' | Format-Table Name, Length, LastWriteTime

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: Instalar-AcompOPMS-Windows
          path: Instalador OPMS/Para-distribuir/*.exe
          if-no-files-found: error
          retention-days: 30
