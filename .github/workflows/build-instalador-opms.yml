name: Build Instalador AcompOPMS

on:
  push:
    branches: [main]
    paths:
      - 'Instalador OPMS/**'
      - '.github/workflows/build-instalador-opms.yml'
  pull_request:
    paths:
      - 'Instalador OPMS/**'
      - '.github/workflows/build-instalador-opms.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Instalador OPMS/instalador/package-lock.json

      - name: Install and build portable (Etapa 13)
        working-directory: Instalador OPMS/instalador
        run: |
          npm ci
          npm run test:unit
          npm run build:win

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: AcompOPMS-Instalador-win-x64
          path: |
            Instalador OPMS/instalador/dist/*.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Instalador OPMS/instalador/package-lock.json

      - name: Install and build AppImage
        working-directory: Instalador OPMS/instalador
        run: |
          npm ci
          npm run test:unit
          npm run build:linux

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: AcompOPMS-Instalador-linux-x64
          path: |
            Instalador OPMS/instalador/dist/*.AppImage
          if-no-files-found: error
