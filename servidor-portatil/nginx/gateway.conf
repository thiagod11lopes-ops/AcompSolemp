# Gateway:
# - HTTP :80  → app na rede local (sem certificado; "nao seguro" mas funciona)
# - HTTPS :443 → app com TLS (cadeado apos instalar a CA)
# - /acomp-ca/ → instalacao opcional do certificado
# proxy_http_version 1.1 e obrigatorio para o Envoy/Kong do Supabase.

resolver 127.0.0.11 ipv6=off valid=10s;

# ---- HTTP (acesso sem certificado) ----
server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  location ^~ /acomp-ca/ {
    alias /etc/nginx/acomp-ca/;
  }
  location = /acomp-ca {
    return 302 /acomp-ca/index.html;
  }

  location = /api/export-dados {
    proxy_pass http://host.docker.internal:9788/api/export-dados;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location / {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }

  location /auth/ {
    proxy_pass http://host.docker.internal:8000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
  location /rest/ {
    proxy_pass http://host.docker.internal:8000/rest/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;
  }
  location /realtime/ {
    proxy_pass http://host.docker.internal:8000/realtime/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }
  location /storage/ {
    proxy_pass http://host.docker.internal:8000/storage/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }
  location /functions/ {
    proxy_pass http://host.docker.internal:8000/functions/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }
}

# ---- HTTPS (opcional, com certificado) ----
server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/gateway.crt;
  ssl_certificate_key /etc/nginx/certs/gateway.key;
  ssl_protocols       TLSv1.2 TLSv1.3;

  client_max_body_size 50m;

  location = /api/export-dados {
    proxy_pass http://host.docker.internal:9788/api/export-dados;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /auth/ {
    proxy_pass http://host.docker.internal:8000/auth/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /rest/ {
    proxy_pass http://host.docker.internal:8000/rest/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /realtime/ {
    proxy_pass http://host.docker.internal:8000/realtime/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /storage/ {
    proxy_pass http://host.docker.internal:8000/storage/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
  location /functions/ {
    proxy_pass http://host.docker.internal:8000/functions/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
