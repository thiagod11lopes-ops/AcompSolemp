# Porta 80: clientes digitam so o nome (ex.: sistema.acompomps.rede)
# Frontend (Vite) + API Supabase no mesmo host.

resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # Frontend Vite/dev ou build
  location / {
    proxy_pass http://host.docker.internal:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Supabase (Kong/Envoy) — mesmos caminhos da API
  location /auth/ {
    proxy_pass http://host.docker.internal:8000/auth/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /rest/ {
    proxy_pass http://host.docker.internal:8000/rest/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /realtime/ {
    proxy_pass http://host.docker.internal:8000/realtime/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
  location /storage/ {
    proxy_pass http://host.docker.internal:8000/storage/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location /functions/ {
    proxy_pass http://host.docker.internal:8000/functions/;
    proxy_set_header Host $host;
  }
}
